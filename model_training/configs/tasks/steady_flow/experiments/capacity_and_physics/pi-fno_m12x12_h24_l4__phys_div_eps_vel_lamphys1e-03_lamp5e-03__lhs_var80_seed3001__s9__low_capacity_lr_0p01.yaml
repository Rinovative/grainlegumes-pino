task: steady_flow

run:
  seed: 9
  deterministic: true
  device: auto
  suffix: low_capacity_lr_0p01

data:
  train_dataset: lhs_var80_seed3001
  ood_datasets:
    - lhs_var120_seed4001
  batch_size: 32

model:
  kind: fno
  params:
    n_modes: [12, 12]
    hidden_channels: 24
    n_layers: 4
    lifting_channel_ratio: 2
    projection_channel_ratio: 2
    fno_skip: linear
    channel_mlp_skip: soft-gating
    implementation: factorized

loss:
  data:
    kind: relative_h1
    space: normalized
    weight: 1.0
  physics:
    enabled: true
    continuity: div_eps_velocity
    derivatives:
      kind: physical
      extension: none
    interior_crop: 0
    residual_weight:
      target: 1.0e-3
      warmup:
        kind: linear
        epochs: 1
    boundary_weight:
      target: 5.0e-3
      warmup:
        kind: linear
        epochs: 1

evaluation:
  objective:
    id: normalized_group_macro_rmse

optimizer:
  kind: adamw
  lr: 1.0e-2
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  second_moment_floor: 1.0e-6

scheduler:
  kind: reduce_on_plateau
  factor: 0.5
  patience: 20
  min_lr: 1.0e-5

training:
  epochs: 600
  evaluation_interval: 5
  ood_evaluation_interval: 5
  mixed_precision: false

tracking:
  wandb:
    mode: online
    workflow: train
    monitor:
      interval: 5
