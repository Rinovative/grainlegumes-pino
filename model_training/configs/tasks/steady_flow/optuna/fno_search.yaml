# Supervised FNO hyperparameter search.
#
# Searches:
#   - Fourier modes
#   - hidden channels
#   - network depth
#   - learning rate
#   - batch size

study:
  name: steady_flow_fno_search
  seed: 9
  n_trials: 30

  sampler:
    kind: tpe
    multivariate: true

  pruner:
    kind: median
    n_startup_trials: 5
    n_warmup_steps: 100
    interval_steps: 5

experiment:
  task: steady_flow

  run:
    seed: 9
    deterministic: true
    device: auto
    suffix: optuna

  data:
    train_dataset: lhs_var80_seed3001
    ood_datasets:
      - lhs_var120_seed4001
    batch_size: 32

  model:
    kind: fno
    params:
      n_modes:
        - 128
        - 160
      hidden_channels: 64
      n_layers: 3

  loss:
    data:
      kind: relative_h1
      space: normalized
      weight: 1.0

    physics:
      enabled: false

  evaluation:
    objective:
      id: normalized_group_macro_rmse

  optimizer:
    kind: adamw
    lr: 0.0003883614530748613
    weight_decay: 0.0001

  scheduler:
    kind: reduce_on_plateau
    factor: 0.5
    patience: 20

  training:
    epochs: 600
    evaluation_interval: 5
    ood_evaluation_interval: 5
    mixed_precision: false

  tracking:
    wandb:
      mode: online
      workflow: optuna_trial
      monitor:
        interval: 5

search_space:
  # FNO architecture.
  model.params.n_modes.0:
    name: modes_x
    kind: categorical
    values:
      - 64
      - 96
      - 128

  model.params.n_modes.1:
    name: modes_y
    kind: categorical
    values:
      - 96
      - 128
      - 160

  model.params.hidden_channels:
    name: hidden_channels
    kind: categorical
    values:
      - 32
      - 64
      - 96

  model.params.n_layers:
    name: n_layers
    kind: categorical
    values:
      - 3
      - 4

  # Optimisation.
  optimizer.lr:
    name: lr
    kind: float
    low: 0.0001
    high: 0.003
    log: true

  data.batch_size:
    name: batch_size
    kind: categorical
    values:
      - 16
      - 32