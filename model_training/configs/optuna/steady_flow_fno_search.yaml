study:
  name: steady_flow_fno_search
  seed: 9
  n_trials: 30
  report_epochs: [300, 400]
  sampler:
    kind: tpe
  pruner:
    kind: median
    n_startup_trials: 0
    n_warmup_steps: 0
    interval_steps: 1

experiment:
  task: steady_flow

  run:
    seed: 9
    deterministic: true
    device: cuda
    prefix: optuna
    suffix: null

  model:
    kind: fno
    params:
      n_modes: [128, 160]
      hidden_channels: 64
      n_layers: 3

  loss:
    data:
      kind: relative_h1
      space: normalized
      weight: 1.0
    physics:
      enabled: false

  evaluation:
    metrics:
      - id: normalized_relative_h1
        kind: relative_h1
        space: normalized
        fields: all
        reduction: sample_mean
      - id: normalized_rmse
        kind: rmse
        space: normalized
        fields: all
        reduction: element_mean
      - id: physical_rmse_p
        kind: rmse
        space: physical
        field: p
        reduction: element_mean
      - id: physical_rmse_u
        kind: rmse
        space: physical
        field: u
        reduction: element_mean
      - id: physical_rmse_v
        kind: rmse
        space: physical
        field: v
        reduction: element_mean
    objective:
      id: normalized_relative_h1

  optimizer:
    kind: adamw
    lr: 3.883614530748613e-4
    weight_decay: 1.0e-4

  scheduler:
    kind: reduce_on_plateau
    factor: 0.5
    patience: 20

  training:
    epochs: 400
    evaluation_interval: 5
    mixed_precision: false

search_space:
  model.params.n_modes.0:
    name: modes_x
    kind: categorical
    values: [24, 32, 48, 64, 96, 128]
  model.params.n_modes.1:
    name: modes_y
    kind: categorical
    values: [32, 48, 64, 96, 128, 160]
  model.params.hidden_channels:
    name: hidden_channels
    kind: categorical
    values: [32, 64, 96, 128]
  model.params.n_layers:
    name: n_layers
    kind: categorical
    values: [3, 4, 5, 6]
  optimizer.lr:
    name: lr
    kind: float
    low: 1.0e-3
    high: 1.5e-2
    log: true
  data.batch_size:
    name: batch_size
    kind: categorical
    values: [16, 32]
