task: steady_flow

run:
  seed: 9
  deterministic: true
  device: cuda
  prefix: null
  suffix: null

model:
  kind: uno
  params:
    modes_x: 64
    modes_y: 64
    hidden_channels: 32
    n_layers: 5
    mode_ratio: 0.5

loss:
  data:
    kind: relative_h1
    space: normalized
    weight: 1.0
  physics:
    enabled: false

evaluation:
  metrics:
    - id: normalized_relative_h1
      kind: relative_h1
      space: normalized
      fields: all
      reduction: sample_mean
    - id: normalized_rmse
      kind: rmse
      space: normalized
      fields: all
      reduction: element_mean
    - id: physical_rmse_p
      kind: rmse
      space: physical
      field: p
      reduction: element_mean
    - id: physical_rmse_u
      kind: rmse
      space: physical
      field: u
      reduction: element_mean
    - id: physical_rmse_v
      kind: rmse
      space: physical
      field: v
      reduction: element_mean
  objective:
    id: normalized_relative_h1

optimizer:
  kind: adamw
  lr: 3.883614530748613e-4
  weight_decay: 1.0e-4

scheduler:
  kind: reduce_on_plateau
  factor: 0.5
  patience: 20

training:
  epochs: 600
  evaluation_interval: 5
  mixed_precision: false
