[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grainlegumes-pino-airflow"
version = "0.1.0"
description = "Physics-informed neural-operator pipeline for steady 2D airflow through heterogeneous porous media, motivated by grain-legume drying applications."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rino M. Albertin" }]

[tool.setuptools]
package-dir = { "" = "model_training" }

[tool.setuptools.packages.find]
where = ["model_training"]
include = ["src*"]

# ============================================================
# 🧹 Ruff Configuration
# ============================================================

[tool.ruff]
line-length = 150
target-version = "py311"
extend-exclude = [
  "venv",
  ".venv",
  ".mypy_cache",
  ".ruff_cache",
  "logs",
  "data",
  "data_generation/data",
  "model_training/data",
  "outputs",
  "results",
  "build",
  "dist"
]

# ------------------------------------------------------------
# ✨ Ruff Formatter
# ------------------------------------------------------------
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ------------------------------------------------------------
# 🧹 Ruff Linter
# ------------------------------------------------------------
[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # 🔧 Formatting conflicts
  "COM812",  # Trailing comma handled by formatter

  # 🧾 Docstring style conflicts
  "D203",  # Conflicts with D211
  "D212",  # Conflicts with D213

  # 📦 Current package structure
  "INP001",  # Allow implicit namespace-style layout in current src setup

  # 🔬 Scientific / research code conventions
  "ANN401",  # Allow Any
  "FBT001", "FBT002", "FBT003",  # Allow boolean arguments
  "PLR0913",  # Allow many function arguments
  "N806", "N803",  # Allow scientific variable names
  "EXE002",  # Ignore executable-bit mismatch
  "T201",  # Allow print statements
  "D205", # Allow multi-line docstring summary to be on a separate line
  "D400", # Allow the first line to not end with a period
  "D415" # Allow the first line to not end with a period, question mark, or exclamation point
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"model_training/notebooks/*.ipynb" = [
  "ANN",  # Interactive notebook helpers do not require a fully typed API surface
  "EM102",  # Direct contextual exception messages are clearer in notebook cells
  "TRY003",  # Notebook validation errors are local, not reusable exception APIs
]

# ------------------------------------------------------------
# 🧠 Code complexity
# ------------------------------------------------------------
[tool.ruff.lint.mccabe]
max-complexity = 20

# ------------------------------------------------------------
# 🧱 Structural limits
# ------------------------------------------------------------
[tool.ruff.lint.pylint]
max-branches = 20
max-statements = 100
max-returns = 10

# ============================================================
# 🧮 Type Checking
# ============================================================

[tool.basedpyright]
include = ["model_training/src", "model_training/tests", "data_generation"]
exclude = ["data_generation/data", "model_training/data"]
extraPaths = ["model_training", "model_training/tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
strict_optional = true

exclude = [
  "logs/",
  "data/",
  "data_generation/data/",
  "model_training/data/",
]

[[tool.mypy.overrides]]
module = [
  "ipywidgets",
  "neuralop",
  "neuralop.*",
  "pandas",
  "scipy",
  "scipy.*",
  "seaborn",
  "tqdm",
  "tqdm.auto",
]
ignore_missing_imports = true
