task: steady_flow

run:
  seed: 9
  deterministic: true
  device: cuda
  prefix: null
  suffix: null

model:
  architecture: UNO
  params:
    modes_x: 64
    modes_y: 64
    hidden_channels: 32
    n_layers: 5
    mode_ratio: 0.5

loss:
  type: supervised
  data_loss: h1

physics:
  enabled: false

optimizer:
  type: adamw
  lr: 3.883614530748613e-4
  weight_decay: 1.0e-4

scheduler:
  type: reduce_on_plateau
  monitor: eval_overall_rmse
  factor: 0.5
  patience: 20

training:
  n_epochs: 600
  eval_interval: 5
  mixed_precision: false
  save_best_metric: eval_overall_rmse
