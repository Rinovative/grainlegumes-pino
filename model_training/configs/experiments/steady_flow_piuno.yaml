task: steady_flow

run:
  seed: 9
  deterministic: true
  device: auto
  prefix: null
  suffix: null

model:
  kind: uno
  params:
    modes_x: 64
    modes_y: 64
    hidden_channels: 32
    n_layers: 5
    mode_ratio: 0.5

loss:
  data:
    kind: relative_h1
    space: normalized
    weight: 1.0
  physics:
    enabled: true
    continuity: div_eps_velocity
    derivatives:
      kind: spectral
      extension: reflect
    interior_crop: 2
    residual_weight:
      target: 1.0e-4
      warmup:
        kind: linear
        epochs: 50
    boundary_weight:
      target: 5.0e-4
      warmup:
        kind: linear
        epochs: 50

evaluation:
  metrics:
    - id: normalized_macro_rmse
      kind: macro_rmse
      space: normalized
      fields: all
      reduction: field_macro_element_mean
    - id: normalized_rmse_p
      kind: rmse
      space: normalized
      fields: [p]
      reduction: element_mean
    - id: normalized_rmse_u
      kind: rmse
      space: normalized
      fields: [u]
      reduction: element_mean
    - id: normalized_rmse_v
      kind: rmse
      space: normalized
      fields: [v]
      reduction: element_mean
    - id: normalized_rmse
      kind: rmse
      space: normalized
      fields: all
      reduction: element_mean
    - id: normalized_relative_l2
      kind: relative_l2
      space: normalized
      fields: all
      reduction: sample_mean
    - id: normalized_relative_h1
      kind: relative_h1
      space: normalized
      fields: all
      reduction: sample_mean
    - id: physical_rmse_p
      kind: rmse
      space: physical
      fields: [p]
      reduction: element_mean
    - id: physical_rmse_u
      kind: rmse
      space: physical
      fields: [u]
      reduction: element_mean
    - id: physical_rmse_v
      kind: rmse
      space: physical
      fields: [v]
      reduction: element_mean
  objective:
    id: normalized_macro_rmse

optimizer:
  kind: adamw
  lr: 3.883614530748613e-4
  weight_decay: 1.0e-4

scheduler:
  kind: reduce_on_plateau
  factor: 0.5
  patience: 20

training:
  epochs: 600
  evaluation_interval: 5
  mixed_precision: false
