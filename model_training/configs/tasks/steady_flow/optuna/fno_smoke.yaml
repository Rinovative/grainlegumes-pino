study:
  name: steady_flow_fno_smoke
  role: smoke
  seed: 9
  n_trials: 5
  sampler:
    kind: tpe
    multivariate: false
  pruner:
    kind: median
    n_startup_trials: 1
    n_warmup_steps: 5
    interval_steps: 1

experiment:
  task: steady_flow

  run:
    seed: 9
    deterministic: true
    device: auto
    suffix: optuna

  data:
    train_dataset: lhs_var80_seed3001
    ood_datasets:
      - lhs_var120_seed4001
    batch_size: 32
    num_workers: 0
    pin_memory: true
    persistent_workers: false

  model:
    kind: fno
    params:
      n_modes:
        - 12
        - 12
      hidden_channels: 24
      n_layers: 4

  loss:
    data:
      kind: relative_h1
      space: normalized
      weight: 1.0
    physics:
      enabled: false

  evaluation:
    objective:
      id: normalized_group_macro_rmse

  optimizer:
    kind: adamw
    lr: 0.001
    weight_decay: 0.0001

  scheduler:
    kind: reduce_on_plateau
    factor: 0.5
    patience: 20

  training:
    epochs: 10
    evaluation_interval: 1
    ood_evaluation_interval: 1
    mixed_precision: false

  tracking:
    wandb:
      mode: online
      workflow: optuna_trial
      monitor:
        interval: 1
        max_cases: 2
      upload:
        evaluation_artifacts: false

search_space:
  model.params.hidden_channels:
    name: hidden_channels
    kind: categorical
    values:
      - 24
      - 32
  optimizer.lr:
    name: lr
    kind: categorical
    values:
      - 0.001
      - 0.003
