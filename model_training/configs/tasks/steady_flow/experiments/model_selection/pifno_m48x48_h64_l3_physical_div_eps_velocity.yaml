# Recreated from named run: PI-FNO-divepsu-PS_m48x48_h64_l3_lamPhys1e-04_lamP7e-04_20260114_070909
# Source config: model_training/data/processed/safe/PI-FNO-divepsu-PS_m48x48_h64_l3_lamPhys1e-04_lamP7e-04_20260114_070909/config.json

task: steady_flow

run:
  seed: 9
  deterministic: true
  device: auto
  suffix: null

data:
  train_dataset: lhs_var80_seed3001
  ood_datasets:
    - lhs_var120_seed4001
  batch_size: 32

model:
  kind: fno
  params:
    n_modes: [48, 48]
    hidden_channels: 64
    n_layers: 3
    lifting_channel_ratio: 2
    projection_channel_ratio: 2
    fno_skip: linear
    channel_mlp_skip: soft-gating
    implementation: factorized

loss:
  data:
    kind: relative_h1
    space: normalized
    weight: 1.0
  physics:
    enabled: true
    continuity: div_eps_velocity
    derivatives:
      kind: physical
      extension: none
    interior_crop: 0
    residual_weight:
      target: 1.3392592245679144e-4
      warmup:
        kind: linear
        epochs: 300
    boundary_weight:
      target: 6.696296122839572e-4
      warmup:
        kind: linear
        epochs: 300

evaluation:
  objective:
    id: normalized_macro_rmse

optimizer:
  kind: adamw
  lr: 4.3682304700764195e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  second_moment_floor: 1.0e-6

scheduler:
  kind: reduce_on_plateau
  factor: 0.5
  patience: 20
  min_lr: 1.0e-5

training:
  epochs: 600
  evaluation_interval: 5
  ood_evaluation_interval: 5
  mixed_precision: false

tracking:
  wandb:
    mode: online
    workflow: train
    monitor:
      interval: 5
