task: steady_flow

run:
  seed: 9
  deterministic: false
  device: auto
  suffix: best_of_class

data:
  train_dataset: lhs_var80_seed3001
  ood_datasets:
    - lhs_var120_seed4001
  batch_size: 32

model:
  kind: uno
  params:
    modes_x: 64
    modes_y: 64
    hidden_channels: 32
    n_layers: 7
    mode_ratio: 0.4951318201313778
    uno_scalings:
      - [1.0, 1.0]
      - [0.5, 0.5]
      - [0.5, 0.5]
      - [1.0, 1.0]
      - [1.0, 1.0]
      - [2.0, 2.0]
      - [2.0, 2.0]
    channel_mlp_skip: linear

loss:
  data:
    kind: relative_h1
    space: normalized
    weight: 1.0

  physics:
    enabled: true
    continuity: div_eps_velocity

    derivatives:
      kind: physical
      extension: none

    interior_crop: 0

    residual_weight:
      target: 1.0489343501429863e-05
      warmup:
        kind: linear
        epochs: 300

    boundary_weight:
      target: 5.043350930442693e-04
      warmup:
        kind: linear
        epochs: 300

evaluation:
  objective:
    id: normalized_group_macro_rmse

optimizer:
  kind: adamw
  lr: 5.319714363424885e-04
  weight_decay: 1.0e-04
  betas: [0.9, 0.999]
  second_moment_floor: 1.0e-06

scheduler:
  kind: reduce_on_plateau
  factor: 0.5
  patience: 20
  min_lr: 1.0e-05

training:
  epochs: 600
  evaluation_interval: 5
  ood_evaluation_interval: 5
  mixed_precision: false

tracking:
  wandb:
    mode: online
    workflow: train
    monitor:
      enabled: true
      interval: 5
      max_cases: 4
    upload:
      evaluation_artifacts: false