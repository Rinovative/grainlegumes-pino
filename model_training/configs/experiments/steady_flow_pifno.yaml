task: steady_flow

run:
  seed: 9
  deterministic: true
  device: cuda
  prefix: null
  suffix: null

model:
  architecture: PI-FNO
  params:
    n_modes: [128, 160]
    hidden_channels: 64
    n_layers: 3

loss:
  type: pino
  data_loss: h1
  loss_type: ps_eps
  lambda_phys: 1.0e-4
  lambda_p: 5.0e-4

physics:
  enabled: true

optimizer:
  type: adamw
  lr: 3.883614530748613e-4
  weight_decay: 1.0e-4

scheduler:
  type: reduce_on_plateau
  monitor: eval_overall_rmse
  factor: 0.5
  patience: 20

training:
  n_epochs: 600
  eval_interval: 5
  mixed_precision: false
  save_best_metric: eval_overall_rmse
