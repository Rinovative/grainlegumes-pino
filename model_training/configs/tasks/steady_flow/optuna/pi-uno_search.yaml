# Full physics-informed UNO hyperparameter search.
#
# Searches:
#   - UNO architecture
#   - continuous mode ratio
#   - learning rate
#   - batch size
#   - continuity formulation
#   - physics-loss weights
#   - independent physics warm-up durations

study:
  name: steady_flow_pi-uno_full_search
  seed: 9
  n_trials: 100

  sampler:
    kind: tpe
    multivariate: true

  pruner:
    kind: median
    n_startup_trials: 5
    n_warmup_steps: 100
    interval_steps: 5

experiment:
  task: steady_flow

  run:
    seed: 9
    deterministic: false
    device: auto
    suffix: optuna

  data:
    train_dataset: lhs_var80_seed3001
    ood_datasets:
      - lhs_var120_seed4001
    batch_size: 32

  model:
    kind: uno
    params:
      modes_x: 64
      modes_y: 64
      hidden_channels: 32
      n_layers: 7
      mode_ratio: 0.4951318201313778
      channel_mlp_skip: linear

  loss:
    data:
      kind: relative_h1
      space: normalized
      weight: 1.0

    physics:
      enabled: true
      continuity: div_eps_velocity

      derivatives:
        kind: physical
        extension: none

      interior_crop: 0

      residual_weight:
        target: 1.0e-4
        warmup:
          kind: linear
          epochs: 300

      boundary_weight:
        target: 5.0e-4
        warmup:
          kind: linear
          epochs: 300

  evaluation:
    objective:
      id: normalized_group_macro_rmse

  optimizer:
    kind: adamw
    lr: 5.319714363424885e-4
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    second_moment_floor: 1.0e-6

  scheduler:
    kind: reduce_on_plateau
    factor: 0.5
    patience: 20
    min_lr: 1.0e-5

  training:
    epochs: 600
    evaluation_interval: 5
    ood_evaluation_interval: 5
    mixed_precision: false
    
  tracking:
    wandb:
      mode: online
      workflow: optuna_trial

      monitor:
        enabled: true
        interval: 5
        max_cases: 4

      upload:
        evaluation_artifacts: false

search_space:
  # UNO architecture.
  model.params.modes_x:
    name: modes_x
    kind: categorical
    values:
      - 32
      - 48
      - 64

  model.params.modes_y:
    name: modes_y
    kind: categorical
    values:
      - 32
      - 48
      - 64

  model.params.hidden_channels:
    name: hidden_channels
    kind: categorical
    values:
      - 16
      - 32
      - 64

  model.params.n_layers:
    name: n_layers
    kind: categorical
    values:
      - 5
      - 7

  model.params.mode_ratio:
    name: mode_ratio
    kind: float
    low: 0.4
    high: 0.6
    log: false

  # Optimisation.
  optimizer.lr:
    name: lr
    kind: float
    low: 1.0e-4
    high: 3.0e-3
    log: true

  data.batch_size:
    name: batch_size
    kind: categorical
    values:
      - 16
      - 32

  # Physics formulation.
  loss.physics.continuity:
    name: continuity
    kind: categorical
    values:
      - div_velocity
      - div_eps_velocity

  # Physics-loss target weights.
  loss.physics.residual_weight.target:
    name: residual_weight
    kind: float
    low: 1.0e-6
    high: 1.0e-3
    log: true

  loss.physics.boundary_weight.target:
    name: boundary_weight
    kind: float
    low: 5.0e-5
    high: 5.0e-3
    log: true

  # Independent warm-up durations.
  loss.physics.residual_weight.warmup.epochs:
    name: residual_warmup_epochs
    kind: categorical
    values:
      - 0
      - 1
      - 50
      - 100
      - 150
      - 200
      - 250
      - 300

  loss.physics.boundary_weight.warmup.epochs:
    name: boundary_warmup_epochs
    kind: categorical
    values:
      - 0
      - 1
      - 50
      - 100
      - 150
      - 200
      - 250
      - 300